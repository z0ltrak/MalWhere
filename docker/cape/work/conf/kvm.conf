[kvm]
# Single machine for now — detonation is sequential, never concurrent
# (see dynamic pipeline design v1 §5/§7, and docker-compose.yml's RAM
# budget comment: cape's 6g mem_limit assumes exactly one guest VM).
machines = win10x64

# Same source of truth as routing.conf's [inetsim] interface — set once
# in .env, read everywhere.
interface = %(ENV:LIBVIRT_BRIDGE)s
dsn = qemu:///system

[win10x64]
label = win10x64
platform = windows
arch = x64
# Guest VM's static IP — you choose this when creating the VM (unlike
# LIBVIRT_BRIDGE/INETSIM_HOST, which host-prereqs.sh discovers), but it
# still lives in .env so there's exactly one place to edit it.
ip = %(ENV:GUEST_VM_IP)s

# Akira, RoningLoader, and WhiteSnake are all x64; no x86-only samples
# in the current set, so tags aren't load-bearing yet.
# tags = win10

# Live snapshot taken with the VM running: logged in, agent already
# listening. CAPE reverts straight to this ready state instead of a
# cold boot per task. RoningLoader disables Driver Signature Enforcement
# and installs kernel drivers — this baseline predates that, so it still
# catches the full chain (dynamic pipeline design v1 §5).
snapshot = clean_baseline

# (Optional) resultserver_ip / resultserver_port — only needed if NAT/PAT
# makes the guest see the Result Server at a different address/port than
# cuckoo.conf's [resultserver] section. Leave unset unless testing shows
# it's needed.
# reserved = no
