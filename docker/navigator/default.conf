# malwhere — ATT&CK Navigator nginx config
#
# The stock ghcr.io/mitre-attack/attack-navigator image ships nginx's
# unmodified default.conf template — literally just `location /`, nothing
# routing the bind-mounted /results (see docker-compose.yml's navigator
# service: `../results:/results:ro`), so navigator_layer.json files were
# never actually reachable at a URL despite the mount existing. This is a
# full replacement of the container's own conf.d/default.conf (bind-mounted
# over it — see docker-compose.yml), not a drop-in addition: nginx's
# `include conf.d/*.conf` only adds whole extra server{} blocks, it can't
# inject a location{} into a server{} block already defined in another
# file, and a second `listen 80` server block here would just conflict
# with the original. Everything below the added `location /results/` block
# is copied verbatim from the original.

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Serves results/<family>/{iocs,attck,stix}/... directly — e.g.
    # /results/akira/attck/navigator_layer.json. autoindex on lets you
    # browse /results/ in a plain directory listing to find files without
    # already knowing the exact path.
    location /results/ {
        alias /results/;
        autoindex on;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
