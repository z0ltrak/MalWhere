# =============================================================================
# malwhere — docker-compose.yml
# Automated Threat Intelligence Extraction Pipeline
# Universidad Complutense de Madrid · TFM 2025-2026
#
# USAGE:
#   Core services only (development):
#     docker compose --profile core up -d
#
#   Full environment (analysis + sandbox):
#     docker compose --profile core --profile sandbox up -d
#
#   Tear down:
#     docker compose --profile core --profile sandbox down
#
# RAM BUDGET (16GB host constraint):
#   core:    static 3g + pipeline 1g + navigator 512m           =  4.5g
#   sandbox: redis 256m + cape 6g + mysql 1g + misp 2g
#            + inetsim 256m                                     =  9.5g
#   both profiles up together                                   = ~14g
#   Leaves ~2g for host OS/Docker overhead — tight. This only works
#   because detonation is sequential, never concurrent VMs (see
#   dynamic pipeline design v1 §5/§7). If cape's 6g limit proves too
#   tight for CAPE + one guest VM in testing, raise cape's mem_limit
#   and reclaim it from navigator (only needed when viewing results —
#   safe to stop it between sessions) before touching anything else.
#   Note: cape and inetsim run with network_mode: host (see the
#   networks: comment below) — their mem_limit/cpus caps still apply,
#   only the networking is different.
#
# NOTE ON REDIS: it's a MISP dependency (background jobs/cache), not a
# CAPE one — CAPE's own default config has no redis integration at all.
# Earlier drafts of this file had cape reading CAPE_REDIS_HOST/PORT env
# vars; those didn't correspond to anything CAPE actually reads and have
# been removed.
# =============================================================================

name: malwhere

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Backend/management network: static, pipeline, MISP, mysql, redis.
  # internal: true enforces "no internet egress" for these — none of them
  # need to reach the internet, and none of them need to be reached FROM
  # the host either (they're either headless tooling or, for MISP, reached
  # indirectly via malwhere_web below).
  #
  # IMPORTANT — internal: true has a side effect beyond blocking egress: it
  # also disables Docker's host-port-publishing NAT rule for EVERYTHING on
  # the network, not just outbound traffic. Confirmed the hard way: MISP's
  # and Navigator's `ports:` mappings looked correct but `docker port`
  # showed nothing actually published — neither web UI was ever reachable
  # from a browser, since Docker can't set up ingress DNAT without also
  # giving the network a real route, which internal:true specifically
  # withholds. That's what malwhere_web (below) exists to fix, without
  # loosening egress for the services that have no reason to need it
  # (static, pipeline, mysql, redis stay internal-only, unaffected).
  #
  # cape and inetsim are NOT on this network — they use network_mode: host
  # instead. This is a deliberate, scoped exception: upstream CAPEv2 has no
  # officially supported Docker deployment (kevoreilly/CAPEv2 issue #617),
  # and every community KVM-in-Docker pattern we found converges on host
  # networking + direct /dev/kvm + host libvirtd access, because that's how
  # libvirt actually expects to manage VM networking. We isolate everything
  # we can at the Docker level; the KVM/libvirt detonation boundary is
  # isolated at the host network/iptables level instead — see
  # scripts/host-prereqs.sh, which is the reproducibility story for that
  # part of the stack.
  malwhere_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: malwhere0

  # Host-facing network for the two services a human actually needs to open
  # in a browser: MISP and the ATT&CK Navigator. NOT internal — a network a
  # host-published port could reach necessarily has a real route, so this
  # network trades "no egress" for "actually reachable from the host",
  # scoped to exactly the two services that need it. Static/pipeline/mysql/
  # redis are never attached here and keep the stricter malwhere_net-only
  # isolation. MISP is on BOTH networks (malwhere_web for the browser,
  # malwhere_net to reach mysql/redis); Navigator only needs malwhere_web —
  # it's a static file server with no backend dependency of its own.
  malwhere_web:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes (persistent data survives container restarts)
# ---------------------------------------------------------------------------
volumes:
  misp_data:
  misp_logs:
  mysql_data:
  redis_data:
  navigator_data:
  pipeline_results:
  # CAPE's data stores. NOT under ./cape/work like conf/storage are — these
  # three live on the container's own overlay filesystem by default, so
  # every rebuild/recreate silently wiped them while leaving the raw report
  # files under work/storage orphaned (present on disk, but with no DB row
  # pointing at them, so the API/web UI can't see them). Named volumes, not
  # bind mounts: Docker seeds a fresh named volume from whatever's already
  # at that path in the image (already-initialized, correct ownership baked
  # in at build time), so first boot behaves exactly as it did before —
  # nothing extra to initialize by hand.
  #
  # cape_task_db is the one that actually matters day-to-day: cuckoo.conf's
  # [database] connection is blank, so CAPE defaults to SQLite at
  # /opt/CAPEv2/db/cuckoo.db (lib/cuckoo/core/database.py) rather than the
  # postgres role/db entrypoint.sh pre-creates — that postgres db sits ready
  # in case connection is ever pointed at it (cuckoo.conf's own comment:
  # "For production we strongly suggest go with PostgreSQL"), but is unused
  # by default. cape_mongo_data is real either way — it's the report index
  # the web UI's analysis view queries, independent of which task-queue
  # backend is active.
  cape_task_db:
  cape_postgres_data:
  cape_mongo_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # -------------------------------------------------------------------------
  # STATIC ANALYSIS
  # REMnux-based container with pefile, FLOSS, DIE, ssdeep, Ghidra headless
  # Profile: core
  # -------------------------------------------------------------------------
  static:
    build:
      context: ./static
      dockerfile: Dockerfile
    container_name: malwhere-static
    profiles: [core]
    volumes:
      - ../samples:/samples:ro # read-only samples
      - ../static/reports:/reports # output from the análisis
      - ../static/scripts:/scripts:ro
      - ./resubmit_queue:/resubmit:ro # artifacts fed back from dynamic analysis (bind mount,
      # not a named volume — dynamic/scripts/parse_cape.py writes to it directly from the
      # host, no container needed, since it's a pure-stdlib script and CAPE storage is
      # already a host-accessible bind mount)
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.10
    environment:
      - PYTHONUNBUFFERED=1
      - RESUBMIT_WATCH_DIR=/resubmit
      - RESUBMIT_TIME_BUDGET_MIN=45
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    # No port exposure — acceso via docker exec o CLI
    # Run static/scripts/process_resubmissions.py (docker compose exec static
    # python3 /scripts/process_resubmissions.py -v) to statically analyze
    # anything dynamic/scripts/parse_cape.py queued into /resubmit, tagging
    # each report with the parent_hash + discovery_mechanism from its
    # manifest so lineage survives into /reports for the pipeline to merge
    # (pipeline/process_resubmissions.py).

  # -------------------------------------------------------------------------
  # PIPELINE (normalizer + mapper + exporter)
  # Python 3.11, mitreattack-python, stix2, PyMISP
  # Profile: core
  # -------------------------------------------------------------------------
  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: malwhere-pipeline
    profiles: [core]
    volumes:
      - ../static/reports:/input/static:ro
      - ../dynamic/reports:/input/dynamic:ro
      - ./cape/work/storage:/input/dynamic/storage:ro # dropped/injected/dumped binaries — lives under cape's /work bind mount, not a separate named volume (see cape service's comment on why)
      - ../pipeline:/app:ro
      - ../results:/results
      - pipeline_results:/output
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.11
    environment:
      - PYTHONUNBUFFERED=1
      - MISP_URL=https://misp
      - MISP_KEY=${MISP_API_KEY:-changeme}
      - MISP_VERIFYCERT=false
      - ATTCK_VERSION=14.1
      # Resubmission loop bound for pipeline/process_resubmissions.py.
      # RESUBMIT_MAX_DEPTH/RESUBMIT_MAX_ARTIFACTS are consumed by
      # dynamic/scripts/parse_cape.py instead (see its --resubmit-* flags) —
      # that script runs on the host, not in this container, since it's
      # pure-stdlib and CAPE storage/./resubmit_queue are host bind mounts.
      - RESUBMIT_TIME_BUDGET_MIN=45
    depends_on:
      - static
    restart: unless-stopped
    mem_limit: 1g
    command: tail -f /dev/null

  # -------------------------------------------------------------------------
  # ATT&CK NAVIGATOR
  # Visualization of layers generated by the mapper
  # Profile: core
  # -------------------------------------------------------------------------
  navigator:
    image: ghcr.io/mitre-attack/attack-navigator:latest
    container_name: malwhere-navigator
    profiles: [core]
    ports:
      - "4200:80"
    volumes:
      - ../results:/results:ro
      - navigator_data:/usr/src/app/nav-app/src/assets/generated
      # Full replacement of the image's own conf.d/default.conf, adding the
      # location /results/ block it doesn't ship with — see
      # docker/navigator/default.conf's own header comment for why this
      # can't be a smaller drop-in addition instead.
      - ./navigator/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - malwhere_web
    restart: unless-stopped
    mem_limit: 512m

  # -------------------------------------------------------------------------
  # REDIS
  # MISP's dependency (background jobs/cache) — NOT CAPE's. CAPE's own
  # default config has no redis integration; see the header note.
  # Profile: sandbox
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: malwhere-redis
    profiles: [sandbox]
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.20
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --save 60 1 --loglevel warning --requirepass redispassword
    # MISP's session backend — without this healthy, MISP's web/API layer
    # fails session_start() on every request (confirmed: "Failed to read
    # session data: redis... Failed to connect" breaks auth even for pure
    # API calls, not just the browser session). misp's depends_on below
    # needs this to actually catch "redis container exists but isn't up
    # yet/isn't reachable", not just "container was started".
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------------
  # INETSIM
  # Simulated network for guest detonations: fake DNS/HTTP/HTTPS responses,
  # every outbound attempt still logged. Default containment mode — see
  # dynamic pipeline design v1 §5. Live/controlled-egress detonation is a
  # separate, explicitly-justified, isolated exception, not the default.
  #
  # network_mode: host, not malwhere_detonation_net — guest VM traffic
  # terminates on the host's own libvirt bridge (virbr0 or similar), which
  # a Docker bridge network can't reach. See the top-level networks:
  # comment for why. This means inetsim's ports (53/80/443) bind directly
  # on the host — confirm nothing else on the host already uses them.
  # Profile: sandbox
  # -------------------------------------------------------------------------
  inetsim:
    build:
      context: ./inetsim
      dockerfile: Dockerfile
    container_name: malwhere-inetsim
    profiles: [sandbox]
    network_mode: host
    environment:
      # Written to .env by scripts/host-prereqs.sh once libvirt is set up.
      # Same value CAPE's own conf files reference as %(ENV:LIBVIRT_GATEWAY)s
      # — one name for one fact, read in both places. ${VAR:?msg} fails
      # `docker compose up` immediately with a clear message if it's
      # missing, on top of entrypoint.sh's own check.
      - LIBVIRT_GATEWAY=${LIBVIRT_GATEWAY:?Run scripts/host-prereqs.sh first to discover this}
    volumes:
      - ../dynamic/reports/inetsim:/var/log/inetsim
    restart: unless-stopped
    mem_limit: 256m

  # -------------------------------------------------------------------------
  # CAPE SANDBOX
  # Dynamic analysis with KVM; requires VT-x enabled on the host and
  # libvirtd running on the host (see scripts/host-prereqs.sh — this is
  # NOT set up by docker-compose, it's a host-level prerequisite).
  #
  # PREREQUISITE: ./cape/Dockerfile builds FROM cape:kvm, which must
  # already exist as a local image — it's not published to a registry.
  # Build it first from celyrin/cape-docker's kvm branch (`make all` in
  # that repo), THEN `docker compose build cape` here. Our Dockerfile
  # layers two fixes on top (see its own header comment) discovered
  # during initial bring-up: a MongoDB kernel-compatibility workaround and
  # a missing libvirt-python install. Building our own layer instead of
  # using cape:kvm directly means a fresh clone of this repo gets both
  # fixes automatically instead of rediscovering them by hand.
  #
  # network_mode: host, not malwhere_net — matches celyrin/cape-docker's
  # documented run command (see top-level networks: comment for why).
  # Also needs systemd support inside the container (cape.service,
  # cape-web.service, cape-processor.service run under it): the cgroup
  # mount, cgroupns, and tmpfs entries below are not optional extras.
  # Profile: sandbox
  # -------------------------------------------------------------------------
  cape:
    build:
      context: ./cape
      dockerfile: Dockerfile
    container_name: malwhere-cape
    profiles: [sandbox]
    privileged: true # necesary for KVM
    network_mode: host
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    devices:
      - /dev/kvm:/dev/kvm # KVM access from container
    env_file:
      # LIBVIRT_GATEWAY / LIBVIRT_BRIDGE (from scripts/host-prereqs.sh) and
      # GUEST_VM_IP (set by hand once the guest VM exists) — CAPE's own
      # conf files reference these via %(ENV:VARNAME)s, so they need to be
      # real env vars inside this container, not just compose-file
      # substitutions.
      - .env
    volumes:
      - ../samples:/samples:ro
      - ../dynamic/reports:/reports
      # NOT a cape_data volume mounted at /opt/CAPEv2/storage — that was
      # wrong. This image symlinks /opt/CAPEv2/storage -> /work/storage on
      # boot, same pattern as conf (confirmed by finding a stray
      # storage/storage -> /work/storage symlink after the mount forced a
      # real directory onto the path the symlink wanted). Mounting
      # anything at /opt/CAPEv2/storage directly blocks that symlink and
      # breaks CAPE's own folder creation on startup. /work below is
      # enough — storage/ lives inside it once the container's own
      # bootstrap (or the manual fix in cape/README.md) creates the
      # symlink correctly.
      - ./cape/work:/work # bind mount, not a named volume — you need to
        # edit work/conf/*.conf directly from the host after first boot
        # (see cape/README.md); NOT :ro, first boot writes conf/ here
      - /var/run/libvirt:/var/run/libvirt # host's libvirtd socket
      # Task DB + report index — see the top-level volumes: comment for why
      # these are separate from /work despite both being "cape data".
      - cape_task_db:/opt/CAPEv2/db
      - cape_postgres_data:/var/lib/postgresql/18/main
      - cape_mongo_data:/var/lib/mongodb
    restart: unless-stopped
    # 6g must cover CAPE itself + one guest VM (sequential detonation only,
    # see dynamic pipeline design v1 §5/§7 — no concurrent VMs). Provision
    # the Windows guest at ~3-4g RAM to leave CAPE's own overhead room;
    # if that's too tight in testing, raise this before shrinking the VM.
    mem_limit: 6g
    cpus: 4.0

  # -------------------------------------------------------------------------
  # MYSQL
  # MISP Backend — only sandbox profile
  # Profile: sandbox
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: malwhere-mysql
    profiles: [sandbox]
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.30
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-malwhere_root}
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-malwhere_misp}
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MISP
  # Plataforma de Threat Intelligence — saves and exports IOCs
  # Profile: sandbox
  # -------------------------------------------------------------------------
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: malwhere-misp
    profiles: [sandbox]
    ports:
      - "443:443" # MISP web UI
    volumes:
      - misp_data:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.31
      malwhere_web:
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-malwhere_misp}
      - MISP_BASEURL=https://localhost
      - MISP_EMAIL=admin@malwhere.local
      - MISP_PASSWORD=${MISP_ADMIN_PASSWORD:-Malwhere2025!}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redispassword
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
