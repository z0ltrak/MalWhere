# =============================================================================
# malwhere — docker-compose.yml
# Automated Threat Intelligence Extraction Pipeline
# Universidad Complutense de Madrid · TFM 2025-2026
#
# USAGE:
#   Core services only (development):
#     docker compose --profile core up -d
#
#   Full environment (analysis + sandbox):
#     docker compose --profile core --profile sandbox up -d
#
#   Tear down:
#     docker compose --profile core --profile sandbox down
# =============================================================================

name: malwhere

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  malwhere_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    # No internet egress from analysis containers
    driver_opts:
      com.docker.network.bridge.name: malwhere0

# ---------------------------------------------------------------------------
# Volumes (persistent data survives container restarts)
# ---------------------------------------------------------------------------
volumes:
  cape_data:
  misp_data:
  misp_logs:
  mysql_data:
  redis_data:
  navigator_data:
  pipeline_results:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # -------------------------------------------------------------------------
  # STATIC ANALYSIS
  # REMnux-based container with pefile, FLOSS, DIE, ssdeep, Ghidra headless
  # Profile: core
  # -------------------------------------------------------------------------
  static:
    build:
      context: ./static
      dockerfile: Dockerfile
    container_name: malwhere-static
    profiles: [core]
    volumes:
      - ../samples:/samples:ro # read-only samples
      - ../static/reports:/reports # output from the análisis
      - ../static/scripts:/scripts:ro # Python scripts
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.10
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    # No port exposure — acceso via docker exec o CLI
    command: tail -f /dev/null # Keeps the container alive

  # -------------------------------------------------------------------------
  # PIPELINE (normalizer + mapper + exporter)
  # Python 3.11, mitreattack-python, stix2, PyMISP
  # Profile: core
  # -------------------------------------------------------------------------
  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: malwhere-pipeline
    profiles: [core]
    volumes:
      - ../static/reports:/input/static:ro
      - ../dynamic/reports:/input/dynamic:ro
      - ../pipeline:/app:ro
      - ../results:/results
      - pipeline_results:/output
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.11
    environment:
      - PYTHONUNBUFFERED=1
      - MISP_URL=https://misp
      - MISP_KEY=${MISP_API_KEY:-changeme}
      - MISP_VERIFYCERT=false
      - ATTCK_VERSION=14.1
    depends_on:
      - static
    restart: unless-stopped
    mem_limit: 1g
    command: tail -f /dev/null

  # -------------------------------------------------------------------------
  # ATT&CK NAVIGATOR
  # Visualization of layers generated by the mapper
  # Profile: core
  # -------------------------------------------------------------------------
  navigator:
    image: ghcr.io/mitre-attack/attack-navigator:latest
    container_name: malwhere-navigator
    profiles: [core]
    ports:
      - "4200:4200"
    volumes:
      - ../results:/results:ro
      - navigator_data:/usr/src/app/nav-app/src/assets/generated
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.12
    restart: unless-stopped
    mem_limit: 512m

  # -------------------------------------------------------------------------
  # REDIS
  # Backend for CAPE; sandbox profile only
  # Profile: sandbox
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: malwhere-redis
    profiles: [sandbox]
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.20
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --save 60 1 --loglevel warning

  # -------------------------------------------------------------------------
  # CAPE SANDBOX
  # Dynamic analysis with KVM; requires VT-x enabled on the host
  # Profile: sandbox
  # -------------------------------------------------------------------------
  cape:
    image: capturetheplatform/cape-sandbox:latest
    container_name: malwhere-cape
    profiles: [sandbox]
    privileged: true # necesary for KVM
    devices:
      - /dev/kvm:/dev/kvm # KVM access from container
    ports:
      - "8000:8000" # API + Web UI
    volumes:
      - ../samples:/samples:ro
      - ../dynamic/reports:/reports
      - cape_data:/opt/CAPEv2/storage
      - ./cape/conf:/opt/CAPEv2/conf:ro
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.21
    environment:
      - CAPE_REDIS_HOST=redis
      - CAPE_REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4.0

  # -------------------------------------------------------------------------
  # MYSQL
  # MISP Backend — only sandbox profile
  # Profile: sandbox
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: malwhere-mysql
    profiles: [sandbox]
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.30
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-malwhere_root}
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-malwhere_misp}
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # MISP
  # Plataforma de Threat Intelligence — saves and exports IOCs
  # Profile: sandbox
  # -------------------------------------------------------------------------
  misp:
    image: ghcr.io/misp/misp-docker/misp-core:latest
    container_name: malwhere-misp
    profiles: [sandbox]
    ports:
      - "8443:443" # MISP web UI
    volumes:
      - misp_data:/var/www/MISP/app/files
      - misp_logs:/var/www/MISP/app/tmp/logs
    networks:
      malwhere_net:
        ipv4_address: 172.20.0.31
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-malwhere_misp}
      - MISP_BASEURL=https://localhost:8443
      - MISP_EMAIL=admin@malwhere.local
      - MISP_PASSWORD=${MISP_ADMIN_PASSWORD:-Malwhere2025!}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
